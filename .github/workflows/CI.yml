name: CI
# Run on master, tags, or any pull request
on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC (8 PM CST)
  push:
    branches: [master]
    tags: ["*"]
    paths-ignore:
      - '**.md'
  pull_request:
jobs:
  docs:
    name: Documentation - Julia 1.11 - Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
          arch: x64
      - uses: julia-actions/cache@v2
      - name: Instantiate documentation environment
        run: julia --project=docs -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Build documentation
        run: julia --project=docs docs/make.jl
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          # - "1.6"  
          - "1.12"    # Latest Release
          - "1.11"    # Latest Release
          #- "1.10"    # Latest Release
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - x64
        # exclude:
        #  # Test 32-bit only on Linux
        #  - os: macOS-latest
        #    arch: x86
        #  - os: windows-latest
        #    arch: x86
        # include:
          # Add a 1.5 job because that's what Invenia actually uses
          # - os: ubuntu-latest
          #  version: 1.5
          #  arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: actions/cache@v4
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-${{ matrix.arch }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-${{ matrix.arch }}-test-
            ${{ runner.os }}-${{ matrix.arch }}-
            ${{ runner.os }}-
      - uses: julia-actions/julia-buildpkg@latest
      - run: |
          git config --global user.name Tester
          git config --global user.email te@st.er
      - uses: julia-actions/julia-runtest@latest
      - uses: julia-actions/julia-processcoverage@v1
      # - uses: codecov/codecov-action@v1
      #  with:
      #    file: lcov.info
  mpi:
    name: MPI (1 and 2 ranks) - Julia 1.11 - Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
          arch: x64
      - uses: julia-actions/cache@v2
      - name: Instantiate with optional MPI
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.add(Pkg.PackageSpec(name="MPI", version="0.20"))'
      - name: Run MPI integration tests
        run: julia --startup-file=no --project=. test/runtests_mpi.jl
